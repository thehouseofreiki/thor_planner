     {label:'Phase 2 \u2014 Wochenrhythmus (Sep 2026+)',badge:'Fix',bb:'#E4DFD6',bc:'#4A4A47',rules:[{label:'Feed-Posts',freq:'2x/Woche',note:'Mo & Do'},{label:'Reels',freq:'2x/Woche',note:'Di & Fr \u2014 aus TikTok recyceln'},{label:'Live',freq:'1x/Woche',note:'z.B. Sonntag Abend, 20\u201330 Min'},{label:'Live-Gewinnspiel',freq:'1x/Monat',note:'1 kostenloser Basics-Zugang pro Live'},{label:'Stories',freq:'t\u00e4glich',note:'Buchungslink, Basics-Link, Alltag'}]},

];

    {label:'Bew\u00e4hrung nicht bestanden',val:'Aberkennung',note:'Leader-Status wird aberkannt \u2014 Provision entf\u00e4llt \u2014 R\u00fcckkehr nur auf erneute Einladung'},

var state={},activeFilter='Alle',SK='hor_planer_v1';
function getWK(){var d=new Date(),day=d.getDay(),diff=d.getDate()-(day||7)+1,mon=new Date(new Date().setDate(diff));return'wk_'+mon.getFullYear()+'_'+mon.getMonth()+'_'+mon.getDate();}
var WK=getWK();

function loadState(){try{var s=localStorage.getItem(SK);if(s)state=JSON.parse(s);}catch(e){}if(!state['ac11'])state['ac11']=true;if(!state._week||state._week!==WK){SM.forEach(function(pl){pl.goals.forEach(function(g){delete state[g.id];});});state._week=WK;saveState();}render();document.getElementById('savenote').textContent='Stand gespeichert';}
function saveState(){try{localStorage.setItem(SK,JSON.stringify(state));var n=new Date();document.getElementById('savenote').textContent='Gespeichert '+n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');}catch(e){}}
function done(id){return state[id]===true;}
function totalCounts(){var d=0,t=0;TODO_DATA.forEach(function(s){s.items.forEach(function(i){t++;if(done(i.id))d++;});});PROD.forEach(function(p){p.steps.forEach(function(s){t++;if(done(s.id))d++;});});return{done:d,total:t};}
function renderStats(){var c=totalCounts(),pct=c.total>0?Math.round(c.done/c.total*100):0;document.getElementById('stats').innerHTML='<div class="stat"><div class="stat-num">'+c.done+'/'+c.total+'</div><div class="stat-lbl">Erledigt</div></div><div class="stat"><div class="stat-num">'+pct+'%</div><div class="stat-lbl">Fortschritt</div></div><div class="stat"><div class="stat-num">'+(c.total-c.done)+'</div><div class="stat-lbl">Offen</div></div>';document.getElementById('pfill').style.width=pct+'%';document.getElementById('pct').textContent=pct+' %';}
function allTags(){var t=['Alle'];TODO_DATA.forEach(function(s){s.items.forEach(function(i){if(t.indexOf(i.tag)===-1)t.push(i.tag);});});return t;}
function renderFilters(){var b=document.getElementById('fbar');b.innerHTML='';allTags().forEach(function(tag){var btn=document.createElement('button');btn.className='fbtn'+(tag===activeFilter?' on':'');btn.textContent=tag;btn.onclick=function(){activeFilter=tag;document.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('on');});btn.classList.add('on');renderTodoList();};b.appendChild(btn);});}
function renderTodoList(){var lists=document.getElementById('lists');lists.innerHTML='';TODO_DATA.forEach(function(sec){var vis=sec.items.filter(function(i){return activeFilter==='Alle'||i.tag===activeFilter;});if(!vis.length)return;var doneC=sec.items.filter(function(i){return done(i.id);}).length;var div=document.createElement('div');div.className='section';div.innerHTML='<div class="sec-hdr"><span class="sec-title">'+sec.title+'</span><span class="sec-badge" style="background:'+sec.bb+';color:'+sec.bc+'">'+sec.badge+'</span><span class="sec-cnt" id="sc-'+sec.id+'">'+doneC+'/'+sec.items.length+'</span></div>';vis.forEach(function(item){var row=document.createElement('div');row.className='item'+(done(item.id)?' done':'');var dl=item.deadline?'<span class="ideadline">bis '+item.deadline+'</span>':'';var lk=item.link?'<a class="ilink" href="'+item.link+'" target="_blank">SumUp \u2192</a>':'';row.innerHTML='<div class="cb"><div class="ck"></div></div><span class="itext">'+item.text+lk+'</span><span class="itag">'+item.tag+'</span>'+dl;row.onclick=function(e){if(e.target.tagName==='A')return;state[item.id]=!done(item.id);row.classList.toggle('done',done(item.id));saveState();renderStats();var sc=document.getElementById('sc-'+sec.id);if(sc){var d2=sec.items.filter(function(i){return done(i.id);}).length;sc.textContent=d2+'/'+sec.items.length;}};div.appendChild(row);});lists.appendChild(div);});}
function renderProd(){var pl=document.getElementById('prod-list');pl.innerHTML='';YR.forEach(function(cfg){var items=PROD.filter(function(p){return p.yr===cfg.yr;});if(!items.length)return;var ds=0,ts=0;items.forEach(function(p){p.steps.forEach(function(s){ts++;if(done(s.id))ds++;});});var block=document.createElement('div');block.className='yr-block';block.innerHTML='<div class="yr-header" style="background:'+cfg.bg+'"><div><div class="yr-label">'+cfg.label+'</div><div class="yr-sub">'+cfg.sub+'</div></div><div class="yr-prog" id="yp-'+cfg.yr+'">'+ds+'/'+ts+' Schritte</div></div>';items.forEach(function(p){var card=document.createElement('div');card.className='prod-item';card.innerHTML='<div class="prod-header"><div class="prod-dot" style="background:'+p.color+'"></div><span class="prod-name">'+p.name+'</span><span class="prod-cat">'+p.cat+'</span></div><div class="prod-launch">\u2192 '+p.launch+'</div><div class="prod-steps" id="st-'+p.id+'"></div>';block.appendChild(card);var stepsEl=card.querySelector('.prod-steps');p.steps.forEach(function(s){var sp=document.createElement('div');sp.className='step'+(done(s.id)?' done':'');sp.innerHTML='<div class="step-cb"><div class="step-ck"></div></div><span class="step-text">'+s.label+'</span><span class="step-date">bis '+s.deadline+'</span>';sp.onclick=function(){state[s.id]=!done(s.id);sp.classList.toggle('done',done(s.id));saveState();renderStats();var yp=document.getElementById('yp-'+cfg.yr);if(yp){var ds2=0,ts2=0;items.forEach(function(pp){pp.steps.forEach(function(ss){ts2++;if(done(ss.id))ds2++;});});yp.textContent=ds2+'/'+ts2+' Schritte';}};stepsEl.appendChild(sp);});});pl.appendChild(block);});}
function updateWgProgress(plId){var pl=SM.find(function(p){return p.id===plId;});if(!pl)return;var dc=pl.goals.filter(function(g){return done(g.id);}).length,tt=pl.goals.length,pct=tt>0?Math.round(dc/tt*100):0;var fill=document.getElementById('wgf-'+plId),lbl=document.getElementById('wgl-'+plId);if(fill)fill.style.width=pct+'%';if(lbl)lbl.textContent=dc+'/'+tt+' diese Woche';}
function renderSocial(){var el=document.getElementById('sm-content');el.innerHTML='';SM.forEach(function(pl){var div=document.createElement('div');div.className='sm-platform';var dc=pl.goals.filter(function(g){return done(g.id);}).length,tt=pl.goals.length,pct=tt>0?Math.round(dc/tt*100):0;var wgGrid='<div class="wg-grid">';pl.goals.forEach(function(g){wgGrid+='<div class="wg-card'+(done(g.id)?' checked':'')+'" id="wgc-'+g.id+'" onclick="toggleGoal(\''+g.id+'\',\''+pl.id+'\')"><div class="wg-info"><div class="wg-label">'+g.label+'</div><div class="wg-sub">'+g.sub+'</div></div><div class="wg-cb"><div class="wg-ck"></div></div></div>';});wgGrid+='</div><div class="wg-progress"><div class="wg-prog-bar"><div class="wg-prog-fill" id="wgf-'+pl.id+'" style="width:'+pct+'%"></div></div><span class="wg-prog-label" id="wgl-'+pl.id+'">'+dc+'/'+tt+' diese Woche</span><span class="wg-reset" onclick="resetWeekGoals(\''+pl.id+'\')">zur\u00fccksetzen</span></div>';var phasesHtml=pl.phases.map(function(ph){var r=ph.rules.map(function(r){return'<div class="sm-rule"><span class="sm-rule-label">'+r.label+(r.note?'<br><span style="font-size:10px;color:var(--ah)">'+r.note+'</span>':'')+' </span>'+(r.freq?'<span class="sm-rule-freq">'+r.freq+'</span>':'')+' </div>';}).join('');return'<div><div class="sm-phase-title">'+ph.label+' <span class="sm-phase-badge" style="background:'+ph.bb+';color:'+ph.bc+'">'+ph.badge+'</span></div><div class="sm-rules">'+r+'</div></div>';}).join('');div.innerHTML='<div class="sm-header"><div class="sm-icon" style="background:'+pl.iconBg+'">'+pl.icon+'</div><div><div class="sm-name">'+pl.name+'</div><div class="sm-tagline">Wochenziel: '+pl.tagline+'</div></div></div><div class="weekly-goal"><div class="wg-title">Wochenziel <span style="color:var(--bd);font-size:9px">\u2014 setzt sich jeden Montag zur\u00fcck</span></div>'+wgGrid+'</div><div class="sm-phases">'+phasesHtml+'</div>';el.appendChild(div);});}
function renderRegeln(){var el=document.getElementById('regeln-content');el.innerHTML='';Object.values(REGELN).forEach(function(sec){var div=document.createElement('div');div.className='reg-card';var rows=sec.items.map(function(item){return'<div class="reg-row"><span class="reg-label">'+item.label+'</span>'+(item.val?'<span class="reg-val" style="color:'+sec.color+'">'+item.val+'</span>':'')+'<span class="reg-note">'+item.note+'</span></div>';}).join('');div.innerHTML='<div class="reg-hdr"><div class="reg-dot" style="background:'+sec.color+'"></div><span class="reg-title">'+sec.title+'</span></div>'+rows;el.appendChild(div);});
// Flow diagrams
var flowEl=document.createElement('div');flowEl.className='reg-card';flowEl.innerHTML='<div class="reg-hdr"><div class="reg-dot" style="background:#2C2C2A"></div><span class="reg-title">Leader-Performance Entscheidungsbaum</span></div>'+
'<div class="flow-wrap"><div class="flow-step ok">10 Kunden/Jahr \u2713</div><div class="flow-arr">\u2192</div><div class="flow-step ok">Leader-Status bleibt &amp; Provision l\u00e4uft</div></div>'+
'<div class="flow-wrap"><div class="flow-step warn">Unter 10 Kunden/Jahr</div><div class="flow-arr">\u2192</div><div class="flow-step warn">3 Monate Bew\u00e4hrung</div><div class="flow-arr">\u2192</div><div class="flow-step ok">5 Kunden in 3 Mon. \u2713 \u2192 Status bleibt</div></div>'+
'<div class="flow-wrap"><div class="flow-step warn">3 Monate Bew\u00e4hrung</div><div class="flow-arr">\u2192</div><div class="flow-step warn">Unter 5 Kunden</div><div class="flow-arr">\u2192</div><div class="flow-step red">Leader-Status aberkannt</div></div>'+
'<div class="warn-box"><strong>Wichtig</strong>Leader-Vereinbarung bis 2028 schriftlich festhalten und rechtspr\u00fcfen lassen. Klare Regeln sch\u00fctzen euch und schaffen Transparenz f\u00fcr die Leader.</div>';
el.appendChild(flowEl);}
function toggleGoal(id,plId){state[id]=!done(id);var card=document.getElementById('wgc-'+id);if(card)card.classList.toggle('checked',done(id));saveState();updateWgProgress(plId);}
function resetWeekGoals(plId){var pl=SM.find(function(p){return p.id===plId;});if(!pl)return;pl.goals.forEach(function(g){delete state[g.id];var card=document.getElementById('wgc-'+g.id);if(card)card.classList.remove('checked');});saveState();updateWgProgress(plId);}
function showTab(id,btn){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});btn.classList.add('on');document.getElementById('panel-'+id).classList.add('on');}
function resetSection(type){if(!confirm(type==='todo'?'To-Do zur\u00fccksetzen?':'Produktionsplan zur\u00fccksetzen?'))return;if(type==='todo')TODO_DATA.forEach(function(s){s.items.forEach(function(i){delete state[i.id];});});else PROD.forEach(function(p){p.steps.forEach(function(s){delete state[s.id];});});saveState();render();}
function render(){renderStats();renderFilters();renderTodoList();renderProd();renderSocial();renderRegeln();}
loadState();
</script>
